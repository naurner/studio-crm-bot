[project]
name = "crmlumi"
version = "0.1.0"
description = "CRM для фотоагентства: заказы, съёмки, задачи"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "gspread>=6.1",
    "google-auth>=2.29",
    "typer>=0.12",
    "rich>=13.7",
    "aiogram>=3.7",
    "httpx>=0.27",
    "msal>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
crmlumi = "crmlumi.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
